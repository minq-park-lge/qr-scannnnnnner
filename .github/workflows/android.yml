name: Build APK

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # ubuntu 러너에는 Android SDK 가 기본 설치되어 있음 (ANDROID_HOME)
      - name: Build debug & release APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/SnapQR-debug.apk
          cp app/build/outputs/apk/release/*.apk dist/SnapQR-release.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: SnapQR-apk
          path: dist/*.apk
          if-no-files-found: error

      # main 브랜치 빌드는 "latest" 릴리스로 올려서 폰에서 바로 설치할 수 있게 함
      - name: Publish rolling "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest
          git push -f origin latest
          NOTES="Automated build of ${GITHUB_SHA::7} ($(git log -1 --pretty=%s))"
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "SnapQR (latest build)" --notes "$NOTES" --prerelease
            gh release upload latest dist/*.apk --clobber
          else
            gh release create latest dist/*.apk --title "SnapQR (latest build)" --notes "$NOTES" --prerelease
          fi
