name: Build APK

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # ubuntu 러너에는 Android SDK 가 기본 설치되어 있음 (ANDROID_HOME)
      - name: Build debug & release APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/SnapQR-debug.apk
          cp app/build/outputs/apk/release/*.apk dist/SnapQR-release.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: SnapQR-apk
          path: dist/*.apk
          if-no-files-found: error
